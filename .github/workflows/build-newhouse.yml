name: Build NewHouse DLL

on:
  push:
    branches:
      - fix/newhouse-performance
  workflow_dispatch:

concurrency:
  group: build-newhouse-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout modified NewHouse source
        uses: actions/checkout@v4

      - name: Checkout reference DLLs
        uses: actions/checkout@v4
        with:
          ref: main
          path: _reference_source

      - name: Prepare reference assemblies
        shell: bash
        run: |
          mkdir -p refs
          cp _reference_source/Assembly-CSharp.dll refs/
          cp _reference_source/UnityEngine.dll refs/
          cp _reference_source/MSCLoader.dll refs/
          cp _reference_source/PlayMaker.dll refs/
          cp _reference_source/cInput.dll refs/
          ls -lh refs

      - name: Build NewHouse
        run: dotnet build NewHouse.csproj --configuration Release

      - name: Upload compiled DLL
        uses: actions/upload-artifact@v4
        with:
          name: NewHouse-performance-fix
          path: bin/Release/net35/NewHouse.dll
          if-no-files-found: error
          retention-days: 14
