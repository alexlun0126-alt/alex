name: Analyze NewHouse assets with AssetStudio
on:
  workflow_dispatch:
  push:
    paths:
      - 'newhouse.part*.rar'
      - '.github/workflows/analyze-newhouse-assetstudio.yml'
jobs:
  analyze:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Extract split RAR archive
        shell: pwsh
        run: |
          7z x newhouse.part1.rar -oextracted -y
          if (!(Test-Path 'extracted/newhouse.unity3d')) { throw 'Unity bundle not extracted' }
          Get-Item 'extracted/newhouse.unity3d' | Format-List Length,FullName
      - name: Get AssetStudio parser
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/Razviar/assetstudio.git AssetStudio-src
          $bundlePath = 'AssetStudio-src/AssetStudio/BundleFile.cs'
          $bundleSource = Get-Content $bundlePath -Raw
          $needle = 'blocksStream.CopyTo(file.stream, node.size);'
          $inject = [string]::Join("`n", @(
            '                blocksStream.CopyTo(file.stream, node.size);',
            '                file.stream.Position = 0;',
            '                try',
            '                {',
            '                    var extractPath = Path.Combine(Path.GetDirectoryName(path), "inner_" + file.fileName);',
            '                    using (var output = File.Create(extractPath)) { file.stream.CopyTo(output); }',
            '                    file.stream.Position = 0;',
            '                    Logger.Info($"INNER_FILE {file.fileName} SIZE {node.size} PATH {extractPath}");',
            '                }',
            '                catch (Exception ex) { Logger.Error($"INNER_EXTRACT_ERROR {ex.Message}"); }'
          ))
          if (!$bundleSource.Contains($needle)) { throw 'Bundle extraction patch point not found' }
          $bundleSource = $bundleSource.Replace($needle, $inject)
          Set-Content -Path $bundlePath -Value $bundleSource -Encoding utf8
          dotnet build AssetStudio-src/AssetStudio.CLI/AssetStudio.CLI.csproj -c Release -f net8.0-windows
      - name: Build asset inventory from Unity 5 bundle
        shell: pwsh
        run: |
          $cli = 'AssetStudio-src/AssetStudio.GUI/bin/Release/net8.0-windows/AssetStudio.CLI.exe'
          if (!(Test-Path $cli)) { throw "AssetStudio CLI not found: $cli" }
          & $cli --game Normal --unity_version 5.0.0f4 --types Shader:None GameObject:Parse Mesh:Parse MeshRenderer:Parse SkinnedMeshRenderer:Parse MeshFilter:Parse MeshCollider:Parse BoxCollider:Parse SphereCollider:Parse CapsuleCollider:Parse Transform:Parse --map_op AssetMap --map_type XML extracted/newhouse.unity3d asset-dump
          if ($LASTEXITCODE -ne 0) { throw "AssetStudio exited with code $LASTEXITCODE" }
          $files = Get-ChildItem asset-dump -Recurse -File -ErrorAction SilentlyContinue
          $xml = $files | Where-Object { $_.Extension -eq '.xml' }
          "EXPORTED_FILES=$($files.Count)" | Out-File asset-analysis-summary.txt
          $files | Group-Object Extension | ForEach-Object { "$($_.Name)=$($_.Count)" | Out-File asset-analysis-summary.txt -Append }
          if (!$xml) { throw 'AssetStudio produced no XML asset map' }
          Copy-Item $xml[0].FullName asset-analysis-map.xml -Force
          [xml]$doc = Get-Content asset-analysis-map.xml -Raw
          $assets = @($doc.SelectNodes('//Asset'))
          "ASSET_ROWS=$($assets.Count)" | Out-File asset-analysis-summary.txt -Append
          $assets | Group-Object { $_.SelectSingleNode('Type').InnerText } | Sort-Object Count -Descending | ForEach-Object { "$($_.Name)=$($_.Count)" | Out-File asset-analysis-summary.txt -Append }
      - uses: actions/upload-artifact@v4
        with:
          name: NewHouse-AssetStudio-inventory
          path: |
            asset-dump/
            asset-analysis-summary.txt
            asset-analysis-map.xml
          if-no-files-found: error
          retention-days: 7
