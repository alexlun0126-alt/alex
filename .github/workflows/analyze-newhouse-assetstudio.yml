name: Analyze NewHouse assets with AssetStudio
on:
  workflow_dispatch:
  push:
    paths:
      - 'newhouse.part*.rar'
      - '.github/workflows/analyze-newhouse-assetstudio.yml'
jobs:
  analyze:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Extract split RAR archive
        shell: pwsh
        run: |
          7z x newhouse.part1.rar -oextracted -y
          if (!(Test-Path 'extracted/newhouse.unity3d')) { throw 'Unity bundle not extracted' }
          Get-Item 'extracted/newhouse.unity3d' | Format-List Length,FullName
      - name: Get AssetStudio parser
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/Razviar/assetstudio.git AssetStudio-src
          $bundlePath = 'AssetStudio-src/AssetStudio/BundleFile.cs'
          $bundleSource = Get-Content $bundlePath -Raw
          $helperPath = 'AssetStudio-src/AssetStudio/AssetsHelper.cs'
          $helperSource = Get-Content $helperPath -Raw
          $helperNeedle = '            var matches = new List<AssetEntry>();'
          $helperInject = [string]::Join("`n", @(
            '            var matches = new List<AssetEntry>();',
            '            var debugPath = Path.Combine(Path.GetDirectoryName(file), "asset_debug.txt");',
            '            var debugText = string.Join(Environment.NewLine, assetsManager.assetsFileList.Select(x => $"FILE={x.fileName}; OBJECTS={x.m_Objects.Count}; VERSION={x.unityVersion}; CLASSIDS=" + string.Join(",", x.m_Objects.GroupBy(o => o.classID).OrderByDescending(g => g.Count()).Select(g => g.Key.ToString() + ":" + g.Count().ToString()))));',
            '            File.AppendAllText(debugPath, debugText + Environment.NewLine);'
          ))
          if (!$helperSource.Contains($helperNeedle)) { throw 'AssetHelper debug patch point not found' }
          $helperSource = $helperSource.Replace($helperNeedle, $helperInject)
          Set-Content -Path $helperPath -Value $helperSource -Encoding utf8
          $managerPath = 'AssetStudio-src/AssetStudio/AssetsManager.cs'
          $managerSource = Get-Content $managerPath -Raw
          $needle = 'var bundleFile = new BundleFile(reader, Game);' + [Environment]::NewLine + [Environment]::NewLine + '                // Priority 2'
          $inject = [string]::Join("`n", @(
            'var bundleFile = new BundleFile(reader, Game);',
            '                Logger.Info($"BUNDLE_NODES {bundleFile.fileList.Count}");',
            '                foreach (var nodeFile in bundleFile.fileList)',
            '                {',
            '                    var extractedPath = Path.Combine(Path.GetDirectoryName(reader.FullPath), "inner_" + Path.GetFileName(nodeFile.fileName));',
            '                    using (var output = File.Create(extractedPath)) { nodeFile.stream.Position = 0; nodeFile.stream.CopyTo(output); nodeFile.stream.Position = 0; }',
            '                    Logger.Info($"INNER_FILE {nodeFile.fileName} SIZE {new FileInfo(extractedPath).Length}");',
            '                }',
            '',
            '                // Priority 2'
          ))
          if (!$managerSource.Contains($needle)) { throw 'AssetsManager bundle patch point not found' }
          $managerSource = $managerSource.Replace($needle, $inject)
          Set-Content -Path $managerPath -Value $managerSource -Encoding utf8
          dotnet build AssetStudio-src/AssetStudio.CLI/AssetStudio.CLI.csproj -c Release -f net8.0-windows
      - name: Build asset inventory from Unity 5 bundle
        shell: pwsh
        run: |
          $cli = 'AssetStudio-src/AssetStudio.GUI/bin/Release/net8.0-windows/AssetStudio.CLI.exe'
          if (!(Test-Path $cli)) { throw "AssetStudio CLI not found: $cli" }
          & $cli --game Normal --unity_version 5.0.0f4 --types Shader:None GameObject:Both Mesh:Both Material:Both Texture2D:Both Sprite:Both Animator:Both AudioClip:Both TextAsset:Both --export_type Dump extracted/newhouse.unity3d asset-dump
          if ($LASTEXITCODE -ne 0) { throw "AssetStudio exited with code $LASTEXITCODE" }
          $files = Get-ChildItem asset-dump -Recurse -File -ErrorAction SilentlyContinue
          "EXPORTED_FILES=$($files.Count)" | Out-File asset-analysis-summary.txt
          $files | Group-Object Extension | ForEach-Object { "$($_.Name)=$($_.Count)" | Out-File asset-analysis-summary.txt -Append }
          if ($files.Count -eq 0) { throw 'AssetStudio exported no asset dumps' }
          $files | Select-Object -First 100 FullName,Length | Format-Table -AutoSize | Out-File asset-analysis-summary.txt -Append
      - uses: actions/upload-artifact@v4
        with:
          name: NewHouse-AssetStudio-inventory
          path: |
            asset-dump/
            extracted/inner_*
            extracted/asset_debug.txt
            asset-analysis-summary.txt
          if-no-files-found: error
          retention-days: 7
