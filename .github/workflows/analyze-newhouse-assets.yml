name: Analyze NewHouse Unity assets
on:
  push:
    paths:
      - 'newhouse.part*.rar'
      - '.github/workflows/analyze-newhouse-assets.yml'
      - 'tools/analyze_newhouse_assets.py'
  workflow_dispatch:
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install extraction tools
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full
      - name: Extract original asset bundle
        run: |
          mkdir -p extracted
          7z x newhouse.part1.rar -oextracted -y
          test -f extracted/newhouse.unity3d
      - name: Install UnityPy
        run: python -m pip install --upgrade pip UnityPy==1.9.28
      - name: Inspect asset bundle
        run: python tools/analyze_newhouse_assets.py
      - uses: actions/upload-artifact@v4
        with:
          name: NewHouse-asset-analysis
          path: newhouse-asset-report.json
          retention-days: 7
